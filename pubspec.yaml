name: jellyplus
description: Poyraz Player — Jellyfin için iOS istemcisi
publish_to: 'none'
version: 3.0.0+36

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2 # tema müziği
  media_kit: ^1.2.6 # oynatıcı (mpv)
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  cached_network_image: ^3.4.1
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  background_downloader: ^9.2.0
  connectivity_plus: ^6.1.0
  screen_brightness: ^1.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/icon.png
  remove_alpha_ios: true
