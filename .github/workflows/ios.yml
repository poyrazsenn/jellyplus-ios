name: iOS IPA derle

on:
  workflow_dispatch: {}
  push:
    branches: [main, v2, v2.1]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS proje dosyalarını oluştur
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.jellyplus --project-name jellyplus .
          fi
          rm -f test/widget_test.dart

      - name: Yenilikleri sürüm notlarından üret
        run: python3 tool/gen_whats_new.py

      - name: Paketleri indir
        run: flutter pub get

      - name: Uygulama simgesi
        run: dart run flutter_launcher_icons || echo "simge oluşturulamadı, varsayılan kullanılacak"

      - name: Info.plist ayarları (HTTP izni, ad, yönler)
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsForMedia bool true" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Poyraz" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Poyraz" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarStyle" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool true" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$P"
          # SideStore güncellemeyi sürüm adının değişmesinden anlar: her betaya kendi adı (3.0.0-beta.19 gibi)
          V=$(sed -n "s/^const kVersion = '\(.*\)';/\1/p" lib/version.dart)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"

      - name: Kod kontrolü (hatalar burada görünür)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: iOS derle (imzasız)
        run: flutter build ios --release --no-codesign

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry JellyPlus.ipa Payload
          ls -lh JellyPlus.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: JellyPlus-ipa
          path: JellyPlus.ipa
          retention-days: 30

      - name: Sürüm numarasını oku
        id: ver
        run: |
          V=$(sed -n "s/^const kVersion = '\(.*\)';/\1/p" lib/version.dart)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $V"

      - name: Bu sürüm daha önce yayınlandı mı
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/tags/v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "yes=1" >> "$GITHUB_OUTPUT"; echo "v${{ steps.ver.outputs.v }} zaten yayında; sürüm numarası artmadıkça yeniden yayınlanmaz."
          else
            echo "yes=0" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub sürümü (main → kararlı, v2 → ön sürüm; '-' içeren sürüm ön sürümdür)
        if: steps.exists.outputs.yes == '0' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Poyraz Player ${{ steps.ver.outputs.v }}
          prerelease: ${{ contains(steps.ver.outputs.v, '-') }}
          body_path: RELEASE_NOTES.md
          files: JellyPlus.ipa

      - name: SideStore kaynağını güncelle
        if: steps.exists.outputs.yes == '0' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/update_sidestore.py "${{ github.repository }}" "${{ steps.ver.outputs.v }}" JellyPlus.ipa

      - name: Eski betaları sil (sadece prerelease ve bu sürümden eski olanlar)
        if: github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/prune_betas.py "${{ github.repository }}" "${{ steps.ver.outputs.v }}"
